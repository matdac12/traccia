<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Traccia hero - issues list</title>
    <style>
      :root {
        --ink: #0b0f14;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        width: 1600px;
        height: 900px;
        overflow: hidden;
        background: var(--ink);
      }
      .scene {
        position: relative;
        width: 1600px;
        height: 900px;
        display: grid;
        place-items: center;
        perspective: 2600px;
      }
      .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(1000px 560px at 20% -8%, rgba(255, 158, 11, 0.13), transparent 62%),
          radial-gradient(1100px 660px at 86% 110%, rgba(6, 182, 212, 0.13), transparent 64%);
      }
      .trail {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1400px;
        height: 240px;
        transform: translate(-50%, -50%);
        background: linear-gradient(90deg, rgba(255, 158, 11, 0.45), rgba(255, 158, 11, 0.05) 42%, rgba(6, 182, 212, 0.05) 58%, rgba(6, 182, 212, 0.45));
        filter: blur(80px);
        opacity: 0.5;
      }
      .dashboard {
        position: relative;
        width: 1380px;
        height: 721px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        background-image: url("./list-dashboard.png");
        background-size: 100% 100%;
        transform: rotateY(-6deg) rotateX(2.5deg);
        transform-origin: center;
        box-shadow:
          0 70px 130px -34px rgba(0, 0, 0, 0.82),
          0 18px 44px -12px rgba(0, 0, 0, 0.6);
      }
      .dashboard::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(115deg, rgba(255, 255, 255, 0.09), transparent 24%, transparent 76%, rgba(0, 0, 0, 0.3));
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="glow"></div>
      <div class="trail"></div>
      <div class="dashboard"></div>
    </div>
  </body>
</html>
