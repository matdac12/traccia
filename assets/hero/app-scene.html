<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Traccia app scene</title>
    <style>
      @font-face {
        font-family: "Geist Mono";
        src: url("../brand/social-preview-src/GeistMono-Regular.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Geist Mono";
        src: url("../brand/social-preview-src/GeistMono-Medium.woff2") format("woff2");
        font-weight: 500;
      }
      :root {
        --ink: #0b0f14;
        --amber: #ff9e0b;
        --cyan: #06b6d4;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--ink);
      }
      #scene {
        position: relative;
        overflow: hidden;
        background: var(--ink);
        font-family: "Geist Mono", ui-monospace, monospace;
      }
      .backdrop {
        position: absolute;
        inset: -8%;
        background-position: center;
        background-size: cover;
        filter: blur(46px) brightness(0.42) saturate(1.15);
        will-change: transform;
      }
      /* Dark frame: no image behind the panel, just ink and the brand glows. */
      .frame-dark {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(1100px 680px at 12% -12%, rgba(255, 158, 11, 0.13), transparent 60%),
          radial-gradient(1200px 760px at 90% 114%, rgba(6, 182, 212, 0.13), transparent 62%),
          linear-gradient(180deg, #0c1119, #080b10 62%, #06080c);
      }
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 92% at 50% 44%, transparent 42%, rgba(0, 0, 0, 0.55) 100%);
      }
      .glow {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
        background:
          radial-gradient(900px 560px at 13% -10%, rgba(255, 158, 11, 0.12), transparent 60%),
          radial-gradient(1000px 660px at 88% 112%, rgba(6, 182, 212, 0.12), transparent 62%);
      }
      .stage {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .frame {
        position: relative;
        overflow: hidden;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        will-change: transform;
        box-shadow:
          0 70px 140px -50px rgba(0, 0, 0, 0.9),
          0 24px 60px -26px rgba(0, 0, 0, 0.7),
          0 0 0 1px rgba(0, 0, 0, 0.55);
      }
      .shot {
        position: absolute;
        inset: 0;
        background-repeat: no-repeat;
        background-size: 100% 100%;
      }
      .shot.second {
        opacity: 0;
      }
      .sweep {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
        background: linear-gradient(105deg, transparent 36%, rgba(255, 255, 255, 0.12) 50%, transparent 64%);
      }
      .scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom, transparent 46%, rgba(3, 5, 8, 0.5) 74%, rgba(3, 5, 8, 0.84));
      }
      .caption {
        position: absolute;
        left: 56px;
        bottom: 46px;
        max-width: 62%;
        opacity: 0;
        will-change: transform, opacity;
      }
      .kicker {
        font-weight: 500;
        font-size: 13px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--amber);
        margin-bottom: 10px;
      }
      .caption p {
        margin: 0;
        font-size: 30px;
        line-height: 1.22;
        font-weight: 500;
        color: #f4f6f9;
        text-shadow: 0 2px 22px rgba(0, 0, 0, 0.75);
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <div class="backdrop" id="backdrop"></div>
      <div class="frame-dark" id="frameDark" hidden></div>
      <div class="vignette"></div>
      <div class="glow" id="glow"></div>
      <div class="stage">
        <div class="frame" id="frame">
          <div class="shot" id="shot"></div>
          <div class="shot second" id="shot2"></div>
          <div class="sweep" id="sweep"></div>
        </div>
      </div>
      <div class="scrim" id="scrim" hidden></div>
      <div class="caption" id="caption"><div class="kicker" id="kicker"></div><p id="captionText"></p></div>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const W = Number(params.get("w") ?? 1920);
      const H = Number(params.get("h") ?? 1080);
      const bg = params.get("bg") ?? "background.png";
      const ui = params.get("ui") ?? "shots/issues-table.png";
      const ui2 = params.get("ui2") ?? "";
      const frame = params.get("frame") ?? "blur";
      const caption = params.get("caption") ?? "";
      const kicker = params.get("kicker") ?? "";
      const pad = Number(params.get("pad") ?? 0.032);

      const scene = document.getElementById("scene");
      scene.style.width = `${W}px`;
      scene.style.height = `${H}px`;

      if (frame === "dark") document.getElementById("frameDark").hidden = false;
      document.getElementById("backdrop").style.backgroundImage = `url("${bg}")`;

      const frameEl = document.getElementById("frame");
      const shot = document.getElementById("shot");
      const shot2 = document.getElementById("shot2");
      const sweep = document.getElementById("sweep");
      const glow = document.getElementById("glow");
      const captionEl = document.getElementById("caption");
      if (caption) {
        document.getElementById("kicker").textContent = kicker;
        document.getElementById("captionText").textContent = caption;
        document.getElementById("scrim").hidden = false;
      }

      const image = new Image();
      image.src = ui;
      const image2 = ui2 ? new Image() : null;
      if (image2) image2.src = ui2;
      const bgImage = new Image();
      bgImage.src = bg;

      const clamp01 = (n) => Math.min(1, Math.max(0, n));
      const TAU = Math.PI * 2;
      window.__seek = (u) => {
        const a = TAU * u;
        const s = Math.sin(a);
        const c = Math.sin(a + Math.PI / 2);
        frameEl.style.transform = `translate3d(${(6 * s).toFixed(2)}px, ${(-4 * c).toFixed(2)}px, 0) scale(${(1.012 + 0.012 * c).toFixed(4)})`;
        document.getElementById("backdrop").style.transform = `translate3d(${(-16 * s).toFixed(2)}px, ${(-10 * c).toFixed(2)}px, 0) scale(1.08)`;
        sweep.style.transform = `translateX(${(-45 + 190 * u).toFixed(2)}%)`;
        glow.style.opacity = (0.9 + 0.1 * c).toFixed(3);
        if (caption) captionEl.style.opacity = clamp01((u - 0.03) / 0.09).toFixed(3);
        if (image2) shot2.style.opacity = clamp01((u - 0.5) / 0.14).toFixed(3);
      };

      const loads = [image, bgImage, ...(image2 ? [image2] : [])].map(
        (im) =>
          new Promise((resolve, reject) => {
            if (im.complete) return resolve();
            im.onload = () => resolve();
            im.onerror = () => reject(new Error(`could not load ${im.src}`));
          }),
      );
      window.__ready = Promise.all(loads).then(() => {
        const width = Math.round(W * (1 - 2 * pad));
        const height = Math.round(width * (image.naturalHeight / image.naturalWidth));
        frameEl.style.width = `${width}px`;
        frameEl.style.height = `${height}px`;
        shot.style.backgroundImage = `url("${ui}")`;
        if (image2) shot2.style.backgroundImage = `url("${ui2}")`;
        window.__meta = { width: W, height: H, panelWidth: width, panelHeight: height };
        window.__seek(0);
      });
    </script>
  </body>
</html>
