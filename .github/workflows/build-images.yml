name: Build and publish images

# The default way to deploy is to build on the Mac (deploy/deploy.sh). This
# workflow is the fallback for when the Mac is unavailable: the aarch64 Linux
# box cannot build linux/amd64 under qemu, so an amd64 runner builds the images
# natively and publishes them to GHCR, and the VPS pulls them (ADR 0016).
#
# The tag is the first 12 characters of the commit SHA, which is what
# `deploy/deploy.sh --ci` looks up. `latest` moves only on main.
on:
  push:
    branches: [main]
    paths: &image-inputs
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build-images.yml"
  pull_request:
    paths: *image-inputs
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: traccia-${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 12 chars, so it matches `git rev-parse HEAD | cut -c1-12` in deploy.sh.
      # `type=sha,format=short` is 7, which is why this is computed by hand.
      - name: Compute the image tag
        id: tag
        run: echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/traccia-${{ matrix.app }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.short }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Pull requests build but do not push, so the workflow is exercised before
      # it lands on main and no image is published from an unmerged branch.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # Every push to main mints a new <sha12> tag; keep only the newest few so the
  # package does not grow forever. `latest` is on the newest version, so it is
  # always kept. deploy.sh prunes the VPS the same way (KEEP_TAGS).
  prune:
    name: Prune old GHCR tags
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - name: Keep the newest 10 versions of traccia-${{ matrix.app }}
        uses: actions/delete-package-versions@v5
        with:
          package-name: traccia-${{ matrix.app }}
          package-type: container
          min-versions-to-keep: 10
